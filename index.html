<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- The stylesheet asks for Inter; without this the app silently falls back
         to Segoe UI, which is most of the difference between "fine" and "premium". -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One request for every family the style tokens name. Weights are limited
         to the ones the token records actually use. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=Space+Grotesk:wght@400..700&family=Archivo:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Serif:ital@0;1&family=Caveat:wght@400..700&family=Courier+Prime:wght@400;700&display=swap"
    />
    <title>TwoPlus — Gym management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
